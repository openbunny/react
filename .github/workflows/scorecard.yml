name: scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  scorecard:
    name: Scorecard
    # scorecard-action cannot read a private repository with GITHUB_TOKEN; the job runs once the repository is public.
    if: github.event.repository.private == false
    permissions:
      contents: read
      id-token: write # the called workflow mints the OIDC token that signs published results
    uses: openbunny/.github/.github/workflows/reusable-scorecard.yml@2383033519e5dd89bfd4e832659933a145e7acde
    with:
      publish: true
