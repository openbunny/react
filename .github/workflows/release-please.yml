name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write # pushes the release commit and tag
      pull-requests: write # opens and updates the release PR
      issues: write # comments release links on issues the release closes
    uses: openbunny/.github/.github/workflows/reusable-release-please.yml@0ef30bf859265abac45761ddb0907022555ab7c5
    with:
      signoff: "Robot <bot@fiona.sm>"
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
