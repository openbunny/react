name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Check
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-check.yml@2383033519e5dd89bfd4e832659933a145e7acde

  gitleaks:
    name: gitleaks
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-gitleaks.yml@2383033519e5dd89bfd4e832659933a145e7acde

  reuse:
    name: reuse
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-reuse.yml@2383033519e5dd89bfd4e832659933a145e7acde

  npm:
    name: Publish npm package
    needs: [check, gitleaks, reuse]
    permissions:
      contents: read
      id-token: write # npm mints the provenance attestation from this OIDC token
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: just install
      - name: tag equals package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(bun -e "console.log(require('./package.json').version)")" = "$TAG"
      - run: just build
      - name: publish
        run: npm publish --access public
