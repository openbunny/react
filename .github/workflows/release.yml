name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Check
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-check.yml@2050692900f7dcd883e416ebee37a1b97b119203 # v0.3.0

  gitleaks:
    name: gitleaks
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-gitleaks.yml@2050692900f7dcd883e416ebee37a1b97b119203 # v0.3.0

  reuse:
    name: reuse
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-reuse.yml@2050692900f7dcd883e416ebee37a1b97b119203 # v0.3.0

  npm:
    name: Publish npm package
    needs: [check, gitleaks, reuse]
    permissions:
      contents: read
      id-token: write # npm mints the provenance attestation from this OIDC token
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: just install
      - name: tag equals package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(bun -e "console.log(require('./package.json').version)")" = "$TAG"
      - run: just build
      - name: publish
        run: npm publish --access public
